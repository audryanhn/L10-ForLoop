<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loop Quest — For Loop Edition</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ══════════ MENU ══════════ -->
    <div id="menu" class="screen active">
      <div class="logo-wrap">
        <!-- pixel robot SVG -->
        <svg
          class="pixel-robot"
          width="64"
          height="64"
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
          style="image-rendering: pixelated"
        >
          <rect x="13" y="1" width="6" height="2" fill="#06b6d4" />
          <rect x="15" y="3" width="2" height="2" fill="#06b6d4" />
          <rect x="8" y="5" width="16" height="12" fill="#1e3a5f" />
          <rect x="9" y="6" width="14" height="10" fill="#0f2744" />
          <rect x="10" y="8" width="4" height="4" fill="#06b6d4" rx="1" />
          <rect x="18" y="8" width="4" height="4" fill="#06b6d4" rx="1" />
          <rect x="11" y="9" width="2" height="2" fill="#e0f7fa" />
          <rect x="19" y="9" width="2" height="2" fill="#e0f7fa" />
          <rect x="12" y="14" width="8" height="1" fill="#06b6d4" />
          <rect x="6" y="17" width="2" height="8" fill="#1e3a5f" />
          <rect x="24" y="17" width="2" height="8" fill="#1e3a5f" />
          <rect x="8" y="17" width="16" height="10" fill="#1e3a5f" />
          <rect x="10" y="19" width="5" height="3" fill="#7c3aed" />
          <rect x="17" y="19" width="5" height="3" fill="#7c3aed" />
          <rect x="6" y="25" width="4" height="2" fill="#1e3a5f" />
          <rect x="22" y="25" width="4" height="2" fill="#1e3a5f" />
          <rect x="10" y="27" width="4" height="3" fill="#1e3a5f" />
          <rect x="18" y="27" width="4" height="3" fill="#1e3a5f" />
        </svg>

        <div class="logo-title">
          <div class="l1">⬛ LOOP QUEST ⬛</div>
          <div class="l2">For Loop Edition</div>
        </div>
        <p class="logo-sub">Latihan interaktif · Pelajaran 10 · JavaScript</p>
      </div>

      <div class="menu-card">
        <p class="menu-section">Pilih Mode Latihan</p>

        <button class="mode-btn m-for" onclick="startGame('for')">
          <div class="mode-icon ic-teal">🔢</div>
          <div>
            <div class="mode-label">For Loop Dasar</div>
            <div class="mode-desc">5 soal · sintaks dan output for loop</div>
          </div>
          <span class="badge easy">EASY</span>
        </button>

        <button class="mode-btn m-forif" onclick="startGame('forif')">
          <div class="mode-icon ic-amber">🔍</div>
          <div>
            <div class="mode-label">For Loop + If</div>
            <div class="mode-desc">
              5 soal · filter, count, accumulate, classify
            </div>
          </div>
          <span class="badge medium">MEDIUM</span>
        </button>

        <!-- <button class="mode-btn m-dom" onclick="startGame('dom')">
          <div class="mode-icon ic-pink">🏗️</div>
          <div>
            <div class="mode-label">Loop with DOM</div>
            <div class="mode-desc">5 soal · createElement & innerHTML</div>
          </div>
          <span class="badge medium">MEDIUM</span>
        </button> -->

        <button class="mode-btn m-mix" onclick="startGame('mix')">
          <div class="mode-icon ic-green">⚡</div>
          <div>
            <div class="mode-label">Mix Challenge</div>
            <div class="mode-desc">9 soal acak dari semua topik</div>
          </div>
          <span class="badge hard">HARD</span>
        </button>
      </div>

      <p
        style="
          font-family: var(--pixel);
          font-size: 7px;
          color: var(--text3);
          margin-top: 0.5rem;
        "
      >
        The Grand Hotel · Web Dev Curriculum
      </p>
    </div>

    <!-- ══════════ GAME ══════════ -->
    <div id="game" class="screen">
      <div class="g-header">
        <button class="back-btn" onclick="goMenu()">◀ MENU</button>
        <div class="h-title" id="h-title">FOR LOOP</div>
        <div class="h-right">
          <span class="q-counter" id="q-counter">1/5</span>
          <div class="hp-row" id="hp-row"></div>
          <span class="xp-lbl" id="xp-lbl">0 XP</span>
        </div>
      </div>
      <div class="prog-bar">
        <div class="prog-fill" id="prog-fill" style="width: 0%"></div>
      </div>

      <div class="g-body">
        <div class="q-card" id="q-card">
          <div class="q-top">
            <span class="q-num" id="q-num">Q1</span>
            <span class="q-typebadge tb-for" id="q-typebadge">for</span>
            <span class="q-diff easy" id="q-diff">★ Easy</span>
          </div>
          <div class="q-body">
            <p class="q-instruction" id="q-instr">Loading...</p>
            <div id="q-content"></div>
          </div>
        </div>

        <!-- DOM preview (shown for DOM questions) -->
        <div id="dom-wrap" style="display: none">
          <div class="dom-preview">
            <div class="dom-label">Output Preview — The Grand Hotel</div>
            <div class="dom-stage" id="dom-stage"></div>
          </div>
        </div>

        <!-- Feedback -->
        <div class="feedback" id="feedback">
          <div class="fb-ico" id="fb-ico">✅</div>
          <div class="fb-body" id="fb-body"></div>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
          <button class="btn-submit" id="btn-submit" onclick="submitAnswer()">
            ▶ CEK JAWABAN
          </button>
          <button class="btn-next" id="btn-next" onclick="nextQuestion()">
            LANJUT ▶▶
          </button>
        </div>
      </div>
    </div>

    <!-- ══════════ RESULT ══════════ -->
    <div id="result" class="screen">
      <div class="result-wrap">
        <div class="r-title" id="r-title">LEVEL CLEAR!</div>
        <div class="r-stars" id="r-stars">⭐⭐⭐</div>
        <div class="r-grade" id="r-grade">A</div>
        <div class="r-stats">
          <div class="stat-box">
            <div class="sn" id="s-ok" style="color: var(--green2)">0</div>
            <div class="sl">BENAR</div>
          </div>
          <div class="stat-box">
            <div class="sn" id="s-err" style="color: var(--red2)">0</div>
            <div class="sl">SALAH</div>
          </div>
          <div class="stat-box">
            <div class="sn" id="s-xp" style="color: var(--amber2)">0</div>
            <div class="sl">XP</div>
          </div>
        </div>
        <p class="r-msg" id="r-msg"></p>
        <div class="r-btns">
          <button class="btn-primary" onclick="retryGame()">
            🔄 COBA LAGI
          </button>
          <button class="btn-secondary" onclick="goMenu()">◀ MENU</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
